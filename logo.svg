<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aaddff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0a0a1a" stroke="url(#shieldGrad)" stroke-width="4"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#shieldGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Shield -->
  <path d="M256 60 L400 120 L400 260 Q400 380 256 440 Q112 380 112 260 L112 120 Z"
        fill="#0d1117" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Inner shield accent -->
  <path d="M256 80 L380 135 L380 255 Q380 360 256 415 Q132 360 132 255 L132 135 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Lock body -->
  <rect x="206" y="220" width="100" height="80" rx="8" fill="url(#lockGrad)" filter="url(#glowStrong)"/>

  <!-- Lock shackle -->
  <path d="M226 220 L226 190 Q226 160 256 160 Q286 160 286 190 L286 220"
        fill="none" stroke="url(#lockGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glowStrong)"/>

  <!-- Keyhole -->
  <circle cx="256" cy="250" r="12" fill="#0a0a1a"/>
  <rect x="250" y="255" width="12" height="25" rx="4" fill="#0a0a1a"/>

  <!-- Binary decoration left -->
  <text x="155" y="180" font-family="monospace" font-size="14" fill="#00ff88" opacity="0.6">1010</text>
  <text x="145" y="200" font-family="monospace" font-size="12" fill="#0066ff" opacity="0.5">0110</text>
  <text x="155" y="340" font-family="monospace" font-size="14" fill="#0066ff" opacity="0.5">1100</text>
  <text x="145" y="360" font-family="monospace" font-size="12" fill="#00ff88" opacity="0.6">0011</text>

  <!-- Binary decoration right -->
  <text x="330" y="180" font-family="monospace" font-size="14" fill="#0066ff" opacity="0.6">0110</text>
  <text x="340" y="200" font-family="monospace" font-size="12" fill="#00ff88" opacity="0.5">1010</text>
  <text x="330" y="340" font-family="monospace" font-size="14" fill="#00ff88" opacity="0.5">0011</text>
  <text x="340" y="360" font-family="monospace" font-size="12" fill="#0066ff" opacity="0.6">1100</text>

  <!-- Top label -->
  <text x="256" y="470" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="url(#shieldGrad)" filter="url(#glow)">EncGO</text>

  <!-- Subtitle -->
  <text x="256" y="495" text-anchor="middle" font-family="monospace" font-size="11" fill="#666">AES-256-GCM | ARGON2ID | RSA-OAEP</text>
</svg>
